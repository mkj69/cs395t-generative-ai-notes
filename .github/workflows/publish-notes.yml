name: Publish notes from Markdown

on:
  push:
    branches: [main]
    paths:
      - "course-notes/**/*.md"
      - "notes/**/*.md"
      - "scripts/build_site.py"
      - "requirements-build.txt"
      - ".github/workflows/publish-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt

      - name: Render public notes
        run: python scripts/build_site.py

      - name: Commit generated site files
        run: |
          if git diff --quiet -- docs; then
            echo "The generated site is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Build site from Markdown notes"
          git push
